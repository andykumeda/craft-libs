[package]
name = "craft-assistant"
description = "Independently installed Craft assistant and app host adapter"
version = "0.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-ai-core.workspace = true
craft-ai-native.workspace = true
craft-assistant-bridge.workspace = true
craft-assistant-install.workspace = true
craft-ui.workspace = true
craft-fonts-build.workspace = true
craft-update.workspace = true
tempfile = "3"
semver = "1"
egui.workspace = true
chrono = { workspace = true, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true

[features]
default = []
runtime = ["egui/default_fonts"]

[[bin]]
name = "craft-assistant"
path = "src/main.rs"
required-features = ["runtime"]

[build-dependencies]
craft-fonts-build.workspace = true
